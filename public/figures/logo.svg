  <rect x="16" y="18" width="32" height="3" rx="1.5" fill="url(#lk)"/>
  <rect x="16" y="27" width="32" height="9"  rx="2" fill="#274b78"/>
  <rect x="16" y="39" width="32" height="9"  rx="2" fill="#1b283f"/>
</svg>
